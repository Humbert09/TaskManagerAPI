spring.application.name=taskmanagerapi

#Conexión y credenciales de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/TaskManagerDB
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#Configuración de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.default_schema=management
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Configuración de Flyway
spring.flyway.enabled=true
spring.flyway.schemas=management
spring.flyway.default-schema=management

#Configuraciones temporales
spring.docker.compose.enabled=false